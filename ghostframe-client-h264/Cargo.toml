[package]
name = "ghostframe-client-h264"
version = "0.1.0"
edition = "2021"

[dependencies]
ffmpeg-next = { workspace = true }
ffmpeg-sys-next = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# Gates two things visible only to tests: `testclip` (a synthetic-clip
# encoder with nine panicking paths) and `vainfo_reports_h264_vld` (the
# independent-of-this-crate's-own-probe ground truth every oracle gates on
# -- see probe.rs). Named `test-support`, not `testclip`, because it now
# carries more than the clip generator. Off by default: Task 3's review
# required exactly this, so the panicking clip encoder can never ship in a
# release build of a production crate by accident.
#
# This crate's own tests (unit tests, and `src/oracle_tests.rs`'s
# `#[cfg(test)]` module) reach both through `#[cfg(any(test, feature =
# "test-support"))]` in lib.rs and probe.rs, with no feature and no
# dev-dependency needed -- `cargo test -p ghostframe-client-h264` runs them
# with no extra flag.
#
# A crate that needs `gradient_clip`/`vainfo_reports_h264_vld` from its OWN
# tests (client-gpu, ghostframe-e2e) enables this feature explicitly under
# its own `[dev-dependencies]`: `ghostframe-client-h264 = { path = "...",
# features = ["test-support"] }`. That is safe specifically because the
# default is off -- a plain `path = "..."` dependency for production use
# gets none of it.
default = []
test-support = []
