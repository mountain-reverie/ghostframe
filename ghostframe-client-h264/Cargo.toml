[package]
name = "ghostframe-client-h264"
version = "0.1.0"
edition = "2021"

[dependencies]
ffmpeg-next = { workspace = true }
ffmpeg-sys-next = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# Gates `testclip`: a synthetic-clip encoder with nine panicking paths that
# exists only to feed tests and oracles. Not on by default.
#
# This crate's own tests reach `testclip` through `#[cfg(any(test, feature =
# "testclip"))]` in lib.rs, with no dev-dependency needed. Any OTHER crate
# that needs `gradient_clip` from its own tests (Tasks 5, 8, 9: client-gpu,
# e2e) enables this feature the normal way -- add this crate under its own
# `[dev-dependencies]` with `features = ["testclip"]` -- since the module is
# gated behind the feature specifically so it can never ship in a release
# build of a production crate by accident.
testclip = []
