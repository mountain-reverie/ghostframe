[package]
name = "ghostframe-client-h264"
version = "0.1.0"
edition = "2021"

[dependencies]
# ffmpeg is the `vaapi` backend's decoder AND the `test-support` clip
# generator / software golden. Those are separate reasons, so it is enabled by
# either feature rather than being tied to the backend: a `v4l2` build with
# `test-support` needs libx264 to produce a clip and a software decode to
# compare against, without wanting VA-API anywhere near it.
ffmpeg-next = { workspace = true, optional = true }
ffmpeg-sys-next = { workspace = true, optional = true }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
gstreamer-allocators = { workspace = true, optional = true }
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# Exactly one backend. `vaapi` is the default because it is what every x86 host
# has; `gstreamer-backend` is for a machine with no VA-API driver at all
# (RK3399/rkvdec is the reference, reached via GStreamer's v4l2codecs). The two
# share this crate's public API -- `H264Decoder`, `HwFrame`, `MappedFrame`,
# `DmabufPlanes` -- and nothing else; see the GLES/V4L2 design §4.6 for why this
# is compile-time rather than a runtime choice.
#
# Named `gstreamer-backend` rather than `gstreamer` because the latter is already
# the name of the optional dependency, and a feature sharing a dependency's name
# is implicitly that dependency -- which would make `--features gstreamer` link
# the crate without selecting the backend, and trip the no-backend
# `compile_error!` in a way that reads as a bug in the guard.
default = ["vaapi"]
vaapi = ["ffmpeg-next", "ffmpeg-sys-next"]
gstreamer-backend = [
    "gstreamer",
    "gstreamer-app",
    "gstreamer-video",
    "gstreamer-allocators",
]

# Gates two things visible only to tests: `testclip` (a synthetic-clip
# encoder with nine panicking paths) and the independent-of-this-crate's-own-probe
# ground truth every oracle gates on -- `vainfo_reports_h264_vld` on VA-API,
# `v4l2_enum_fmt_reports_h264_slice` on V4L2 (see probe.rs). Named
# `test-support`, not `testclip`, because it now carries more than the clip
# generator. Off by default: Task 3's review required exactly this, so the
# panicking clip encoder can never ship in a release build of a production
# crate by accident.
#
# It pulls ffmpeg in under BOTH backends, deliberately. The V4L2 oracle's
# whole job is to compare hardware output against a software decode, and
# libavcodec is the software decoder -- linking it into a test build is the
# point, not a leak of the other backend.
#
# This crate's own tests (unit tests, and `src/oracle_tests.rs`'s
# `#[cfg(test)]` module) reach both through `#[cfg(any(test, feature =
# "test-support"))]` in lib.rs and probe.rs, with no feature and no
# dev-dependency needed -- `cargo test -p ghostframe-client-h264` runs them
# with no extra flag.
#
# A crate that needs `gradient_clip`/the ground truth from its OWN tests
# (client-gpu, ghostframe-e2e) enables this feature explicitly under its own
# `[dev-dependencies]`: `ghostframe-client-h264 = { path = "...", features =
# ["test-support"] }`. That is safe specifically because the default is off --
# a plain `path = "..."` dependency for production use gets none of it.
test-support = ["ffmpeg-next", "ffmpeg-sys-next"]
