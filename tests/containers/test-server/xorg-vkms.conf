# Xorg config for the e2e test-server container running on VKMS.
# `Option "kmsdev" "/dev/dri/card0"` pins the modesetting driver to VKMS
# specifically (the host may also have amdgpu at /dev/dri/card1 which we
# do NOT want to grab). The Virtual-1 connector that VKMS exposes lets
# Xorg attach a framebuffer. The server captures over X11 (root window),
# not from this framebuffer; the harness's GPU setups use this config so
# the container's Xorg runs on the VKMS device they bind-mount.
Section "Device"
    Identifier "VKMS"
    Driver     "modesetting"
    Option     "kmsdev" "/dev/dri/card0"
    # Force the shadow-buffer path: X renders into a CPU shadow then
    # blits to the KMS scanout FB. Without glamor or ShadowFB, the
    # modesetting driver may write directly into the dumb buffer with
    # no FB-update trigger, leaving DMA-BUF importers reading stale
    # memory and seeing zero motion.
    Option     "ShadowFB" "true"
    # PageFlip "false": disable double-buffering. With PageFlip enabled,
    # modesetting allocates two BOs and ping-pongs between them; the BO
    # exported via PRIME at session-start may be the back-buffer that
    # never becomes scanout again, leaving a PRIME importer reading a
    # stale buffer. Single-buffer (PageFlip=false) forces every blit into
    # the one BO.
    Option     "PageFlip" "false"
    # AccelMethod=none disables glamor/DRI3 acceleration; software-only
    # rendering directly into the FB.
    Option     "AccelMethod" "none"
    # DRI=false disables DRI extensions; client apps render via core X
    # protocol only (no shared memory, no DRI3 pixmaps that would
    # short-circuit ShadowFB and write to a different BO than the one
    # we exported).
    Option     "DRI"      "false"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    HorizSync  28.0-80.0
    VertRefresh 48.0-75.0
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "VKMS"
    Monitor    "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Modes  "1920x1080" "1280x720" "640x480"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU"     "false"
    Option "DontVTSwitch"   "true"
EndSection
