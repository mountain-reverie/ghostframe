# Ghostframe headless Xorg configuration for amdgpu.
#
# This config tells Xorg to bind the amdgpu driver, refuse to auto-claim any
# physical connector, and present a single virtual display, allocated up to
# 4096x2160 with a 1920x1080 mode active by default before any client
# negotiates something else. The combination means a Ghostframe-managed Xorg
# can run on the same GPU as your local desktop without ever taking over your
# real monitor.
#
# Required kernel module option (set this on the host, then reboot):
#
#   /etc/modprobe.d/amdgpu.conf:
#       options amdgpu virtual_display=<PCI_ID>,1
#
# Find <PCI_ID> with: lspci -D | grep VGA  (use the form 0000:03:00.0)
# The trailing ",1" tells amdgpu to create one virtual connector.
#
# "never taking over your real monitor" is enforced by `ZaphodHeads` in the
# Device section below, not by AutoAddGPU/AutoBindGPU. Read that comment
# before changing it.
#
# Consequence worth knowing: with ZaphodHeads set, Xorg **fails to start**
# if the `Virtual-1` connector does not exist -- which is what you get when
# the modprobe option above is missing or the machine has not been rebooted
# since it was added. That is deliberate. The previous behaviour was to
# start anyway and drive a physical output instead, which is far harder to
# diagnose than a refusal. Check `ls /sys/class/drm/ | grep Virtual` first.

Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
    Option "AutoAddGPU" "off"
    Option "AutoBindGPU" "off"
EndSection

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AutoAddDevices" "false"
EndSection

Section "Device"
    Identifier "Card0"
    Driver "amdgpu"
    Option "Monitor-Virtual-1" "VirtualMonitor"
    # Bind this X screen to the virtual connector ONLY.
    #
    # `Monitor-Virtual-1` above only *assigns a Monitor section* to that
    # output; it does not stop the server from using the others. Without
    # ZaphodHeads, Xorg enumerates every connector on the card and the DDX
    # lights up whatever reports connected -- so a KVM or monitor plugged
    # into a physical port at the moment this server starts gets driven by
    # the Ghostframe session instead of the local one. Observed in
    # production on a PiKVM: sometimes it showed the Ghostframe desktop
    # rather than the console session, depending on whether the KVM was
    # presenting EDID when this server came up.
    #
    # ZaphodHeads restricts the screen to the named output, so the physical
    # connectors are never candidates regardless of what is attached.
    # Preferred over per-connector `Option "Ignore"` entries: it needs no
    # knowledge of this machine's connector names and does not silently
    # stop working when the hardware changes.
    Option "ZaphodHeads" "Virtual-1"
EndSection

Section "Monitor"
    Identifier "VirtualMonitor"
    HorizSync 30.0-120.0
    VertRefresh 50.0-75.0
    Modeline "1920x1080" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -HSync +VSync
    Option "Enable" "true"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    Monitor "VirtualMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        # "Modes" is only what exists before any client has connected — a
        # bootstrap default, not the negotiated set. ghostframe-xdaemon
        # creates the mode a connecting client actually needs at runtime via
        # RandR CreateMode (see display.rs), so this list does not need to
        # grow to cover every resolution we intend to negotiate; one sane
        # default is enough. Left at 1920x1080 unchanged.
        Modes "1920x1080"
        # "Virtual" sets the framebuffer allocation RandR can resize within.
        # Raised from 1920x1080 to 4096x2160 (M4b) so a client with a larger
        # display than 1080p isn't clamped to it regardless of what its own
        # screen supports.
        #
        # What we know: this is what X calls the server's *startup*
        # framebuffer size. What is genuinely unresolved is whether it is
        # also a *ceiling* RandR cannot grow past at runtime, or merely the
        # initial allocation. A live server measured for this change reported
        # `xrandr --prop` screen limits of "minimum 320x200 ... maximum
        # 16384x16384" — that number comes from the driver's
        # GetScreenSizeRange, not from this Virtual line, and RandR 1.2
        # drivers can in principle grow the screen past their startup size
        # through the driver's own resize hook. Whether amdgpu's virtual
        # connector actually does that for a value larger than this Virtual
        # line is not established here; it needs an X server running against
        # the real driver to answer, which is out of scope for a config
        # change. See docs/superpowers/specs/2026-09-24-native-client-m4b-design.md
        # §2.1. Until that is settled, raising this value is the prudent
        # choice regardless of the answer: if Virtual is a hard ceiling, this
        # is required; if it's only the initial size, this still removes a
        # dependency on the driver reallocating and guarantees the common
        # case (a client up to 4096x2160) without one.
        #
        # Cost: a bigger framebuffer allocation whether or not it's ever
        # negotiated up to. Arithmetic estimate (NOT measured — see commit
        # message): 4096*2160*4 bytes ~= 35.4 MB vs. 1920*1080*4 bytes ~= 8.3
        # MB, a delta of roughly 27 MB resident for the X server's front
        # buffer. Confirming this requires comparing
        # `grep VmRSS /proc/$(pgrep -f "Xorg :1")/status` between the two
        # configs on real amdgpu hardware with virtual_display enabled;
        # nothing in this environment can do that (no spare X server, no
        # root, and the amdgpu virtual_display kernel option is a host-level
        # setting this change cannot exercise).
        Virtual 4096 2160
    EndSubSection
EndSection
