[package]
name = "ghostframe-tsnet"
version = "0.1.0"
edition = "2021"

# The tsnet byte pump, and the only sanctioned way onto the wire.
#
# Extracted from `ghostframe-lib` so a client can use it without pulling in
# the server. Nothing here offers a plain socket: every path goes through
# ghostbridge into the tailnet, which is a security property the module
# boundary is meant to make hard to lose rather than a convention to
# remember.

[features]
default = []

# Embed the browser SPA into the ghostbridge archive.
#
# Off by default, and deliberately: ghostbridge `//go:embed`s
# ghostframe-web-client/dist unconditionally, which made every consumer of
# this crate -- including the native client, which never serves a browser
# anything -- run `npm install && vite build` before it could link. Servers
# (`ghostframe-lib`) turn it on; the native client (`ghostframe-cli`,
# `ghostframe-client-native`) leaves it off and skips the web toolchain
# entirely.
#
# Forgetting it on a new server crate is not silent: ghostbridge's
# `startWebListeners` refuses to bind when the embed is absent and says so.
web-embed = []

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
