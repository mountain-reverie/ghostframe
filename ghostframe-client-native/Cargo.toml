[package]
name = "ghostframe-client-native"
version = "0.1.0"
edition = "2021"

[dependencies]
ghostframe-protocol = { path = "../ghostframe-protocol" }
ghostframe-client-core = { path = "../ghostframe-client-core" }
ghostframe-client-net = { path = "../ghostframe-client-net" }
ghostframe-client-gpu = { path = "../ghostframe-client-gpu", default-features = false }
# `default-features = false`: the decode backend follows this crate's
# `vulkan`/`gles` feature, forwarded below, not the dependency's default.
# Leaving defaults on re-enables `vaapi` and collides with the `v4l2` that
# `gles` selects -- and because cargo unions features across the whole graph,
# it does so from HERE even though `ghostframe-client-gpu` gets it right, which
# surfaces as that crate's mutually-exclusive-backends `compile_error!`.
ghostframe-client-h264 = { path = "../ghostframe-client-h264", default-features = false }
ghostframe-tsnet = { path = "../ghostframe-tsnet" }
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# The GPU backend, forwarded from `ghostframe-client-gpu`. Exactly one, and
# mutually exclusive -- see that crate's `[features]` for why the choice is
# compile-time. Forwarded rather than resolved here so a consumer picks the
# backend once, at the top of the tree, instead of every crate in the chain
# having an opinion.
[features]
default = ["vulkan", "decode-vaapi"]
vulkan = ["ghostframe-client-gpu/vulkan"]
gles = ["ghostframe-client-gpu/gles"]

# The decode backend, a separate axis -- see `ghostframe-client-gpu`'s
# `[features]` for why it cannot be folded into the pair above.
decode-vaapi = [
    "ghostframe-client-gpu/decode-vaapi",
    "ghostframe-client-h264/vaapi",
]
decode-v4l2 = [
    "ghostframe-client-gpu/decode-v4l2",
    "ghostframe-client-h264/v4l2",
]
