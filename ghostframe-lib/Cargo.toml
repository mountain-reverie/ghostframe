[package]
name = "ghostframe-lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Enables benches that require real VA-API / Vulkan (skipped on CI without GPU).
gpu-bench = []
# Enables benches for codecs not yet implemented (BC1, PalRle, CDF53, Solid).
# Currently a no-op; flip on as each codec lands in M3.
m3 = []

[dependencies]
quinn-proto = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
web-transport-proto = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
time = { workspace = true }
ash = { workspace = true }
ffmpeg-next = { workspace = true }
ffmpeg-sys-next = "8.1.0"

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
testcontainers = "0.27"
chromiumoxide = "0.9"
serde_json = "1"
anyhow = "1"
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
url = "2"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
iai-callgrind = "0.14"
lz4_flex = "0.11"

[[bench]]
name = "codec_latency"
harness = false
