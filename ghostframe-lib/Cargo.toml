[package]
name = "ghostframe-lib"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Enables benches that require real VA-API / Vulkan (skipped on CI without GPU).
gpu-bench = []
# Enables benches for codecs not yet implemented (BC1, PalRle, CDF53, Solid).
# Currently a no-op; flip on as each codec lands in M3.
m3 = []
# Exposes the deterministic loss-injection module outside of cfg(test).
# Used by E2E integration tests that live in a separate crate.
test-loss-injection = []
# Exposes the IoBridge socketpair constructors outside of cfg(test), for the
# browserless e2e harness in ghostframe-e2e. Will also gate the tile-injection
# channel once that lands. Pulls in tokio's `test-util` feature (`pause()` /
# `advance()`) explicitly -- the harness runs the real IoBridge event loop
# under a paused tokio clock, and that's a real dependency of this feature,
# not an incidental side effect of some other feature enabling it.
#
# Implies `test-loss-injection` for the same reason: `set_drop_plan` is gated
# on this feature, but the `drop_plan` field and the hook it drives in
# `send_to_all_sessions` live behind `test-loss-injection` alongside
# `outbound_loss`. Without the implication, enabling this feature alone leaves
# the setter referring to a field that does not exist.
browserless-harness = ["test-loss-injection", "tokio/test-util", "ffmpeg-oracle"]
# The libavcodec decoder oracle (`encoder::h264::pcm_decoder`). Implied by the
# harness; never part of the daemon.
ffmpeg-oracle = ["dep:ffmpeg-next", "dep:ffmpeg-sys-next"]
# Cdf53 GPU-vs-CPU diagnostic instrumentation: GHOSTFRAME_CDF53_DIFF_TILE
# one-shot diff log on the io_bridge encode path.
# Off by default — production builds never pay the runtime env-var checks
# or extra CPU forward overhead. Test-server Dockerfile flips this on.
cdf53-diag = []
# TEST BUILDS ONLY. Lets device selection fall back to a software Vulkan
# device (llvmpipe, SwiftShader) when no real GPU is present, so the e2e
# test-server image, which has no /dev/dri, can run the real daemon. Production
# refuses a CPU device. It is passed only by tests/containers/test-server/
# Dockerfile's own `cargo build --features`, and must never be named by a
# workspace member's Cargo.toml (feature unification would carry it into a
# release build): ci/check-test-features.sh enforces that, and ci-local checks
# the release binary does not contain its log literal.
allow-software-vulkan = []

[dependencies]
ghostframe-protocol = { path = "../ghostframe-protocol" }
# aws-lc-rs for X25519MLKEM768 (see `transport::quic::pq_provider`). `ring` stays
# on rustls only because ghostframe-e2e's harness names `rustls::crypto::ring`.
quinn-proto = { workspace = true, features = ["rustls-aws-lc-rs"] }
tokio = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
# `web-embed`: this is the server half, so the ghostbridge archive it links
# must carry the browser SPA. The feature is off by default so the native
# client can link the same crate without building the web client; enabling
# it here is what keeps `ghostframe-server` serving a real client.
ghostframe-tsnet = { path = "../ghostframe-tsnet", features = ["web-embed"] }
tracing = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "ring"] }
rcgen = { workspace = true }
rayon = "1.10"
# Standalone Rust port of libwebrtc's Google Congestion Control, used for the
# delay-gradient + loss-based bandwidth estimate. str0m's own GoogCC port is
# pub(crate) and cannot be constructed without an Rtc session (verified against
# both 0.21 and 0.23.1), which is why this is a separate crate rather than
# str0m. See docs/superpowers/specs/2026-09-10-bwe-pacing-design.md.
goog_cc = "=0.1.4"
web-transport-proto = { workspace = true }
sha2 = { workspace = true }
smallvec = "1"
hex = { workspace = true }
libc = { workspace = true }
time = { workspace = true }
ash = { workspace = true }
# Dev-only: the harness's independent libavcodec decoder (the oracle for the
# streams our own writers make). No encoder path of the daemon uses it, and
# `ci/check-release-features.sh` fails if the daemon's dependency tree names it.
ffmpeg-next = { workspace = true, optional = true }
ffmpeg-sys-next = { workspace = true, optional = true }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
serde_json = "1"
anyhow = "1"
futures = "0.3"
url = "2"
proptest = "1"
ghostframe-test-pattern = { path = "../ghostframe-test-pattern" }
ghostframe-client-core = { path = "../ghostframe-client-core" }
# The decoder oracle of the unit tests (`pcm_decoder`, the libva-direct tests).
ffmpeg-next = { workspace = true }
ffmpeg-sys-next = { workspace = true }
