[package]
name = "ghostframe-lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Enables benches that require real VA-API / Vulkan (skipped on CI without GPU).
gpu-bench = []
# Enables benches for codecs not yet implemented (BC1, PalRle, CDF53, Solid).
# Currently a no-op; flip on as each codec lands in M3.
m3 = []
# Exposes the deterministic loss-injection module outside of cfg(test).
# Used by E2E integration tests that live in a separate crate.
test-loss-injection = []
# Cdf53 GPU-vs-CPU diagnostic instrumentation: GHOSTFRAME_CDF53_DIFF_TILE
# one-shot diff log on the io_bridge encode path, GHOSTFRAME_CDF53_SKIP_L2_L3
# / GHOSTFRAME_CDF53_SKIP_L3 env-var gates on the GPU forward pipeline, and
# the CPU `forward_level1_only` / `forward_level2_only` reference helpers.
# Off by default — production builds never pay the runtime env-var checks
# or extra CPU forward overhead. Test-server Dockerfile flips this on.
cdf53-diag = []

[dependencies]
quinn-proto = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
rayon = "1.10"
web-transport-proto = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
time = { workspace = true }
ash = { workspace = true }
ffmpeg-next = { workspace = true }
ffmpeg-sys-next = "8.1.0"

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
serde_json = "1"
anyhow = "1"
futures = "0.3"
url = "2"
proptest = "1"
lz4_flex = "0.11"
ghostframe-test-pattern = { path = "../ghostframe-test-pattern" }
