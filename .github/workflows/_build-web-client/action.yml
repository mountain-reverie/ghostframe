name: Build the ghostframe web client
description: >
  Builds the web client into ghostframe-web-client/dist/. ghostbridge
  //go:embeds that directory at compile time, so every job that builds or
  runs a ghostframe binary needs it present.

  No Node. The build needs two pinned tools, wasm-bindgen-cli (at the
  version in Cargo.lock) and binaryen's wasm-opt (version_117), installed by
  ci/install-web-tools.sh into $RUNNER_TOOL_CACHE/gf-web-tools (outside target/, which
  Swatinem/rust-cache prunes) and cached; then
  ci/build-web.sh does the build, the same script `just build-web` runs.

  ci.yml's web-client job calls this action, then checks the wasm size and
  uploads the dist artifact.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Pinned wasm-bindgen version
      id: bindgen
      shell: bash
      run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"
    # Cached because this action runs in many jobs; building wasm-bindgen-cli
    # from source in each is minutes of CI per push for tools that change only
    # when a pinned version does.
    - name: Web tools location
      shell: bash
      run: echo "GF_WEB_TOOLS=$RUNNER_TOOL_CACHE/gf-web-tools" >> "$GITHUB_ENV"
    - name: Cache web tools
      id: cache-web-tools
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/gf-web-tools
        key: web-tools-${{ steps.bindgen.outputs.version }}-${{ hashFiles('ci/install-web-tools.sh') }}-${{ runner.os }}
    - name: Install web tools
      if: steps.cache-web-tools.outputs.cache-hit != 'true'
      shell: bash
      run: ci/install-web-tools.sh
    - name: build web client (ghostbridge //go:embeds it)
      shell: bash
      run: ci/build-web.sh
