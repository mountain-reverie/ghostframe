name: client-core
on:
  push: { branches: [master] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      # ghostframe-client-net is deliberately NOT tested here: its
      # dev-dependencies reach ghostframe-lib (for QuicServer in the test
      # helpers), which needs the ffmpeg dev libraries this deliberately
      # lightweight workflow does not install. Its tests run in e2e.yml's
      # browserless job, which does install them. The wasm build below still
      # covers it, and does not build dev-dependencies.
      # ghostframe-render: lib tests on wgpu's no-op backend, plus its coalesce
      # and dirty targets (moved from ghostframe-client-gpu). No GPU needed.
      - run: cargo test -p ghostframe-protocol -p ghostframe-client-core -p ghostframe-render -p ghostframe-web-ui
      - run: cargo build -p ghostframe-protocol -p ghostframe-client-core -p ghostframe-render -p ghostframe-client-net -p ghostframe-client-wasm -p ghostframe-web-ui --target wasm32-unknown-unknown

  wasm-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ghostframe-web-client/package-lock.json
      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}
      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Install web client deps
        working-directory: ghostframe-web-client
        run: npm ci
      # npm test builds pkg-node (build:wasm:node) and gates the protocol
      # staleness stamp, the wasm smoke test, and all pre-existing suites
      # together.
      - name: Build wasm and run the vitest suites
        working-directory: ghostframe-web-client
        run: npm test
      # npm test only exercises the nodejs wasm-pack target. The browser
      # bundle (what the SPA actually ships) uses the web target instead,
      # so without this step a break there would surface only at cutover.
      - name: Build the browser-target wasm
        working-directory: ghostframe-web-client
        run: npm run build:wasm

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}
      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Clippy (wasm32)
        run: cargo clippy -p ghostframe-web-ui --target wasm32-unknown-unknown --all-targets -- -D warnings
      # Mounts the real panel over a real ClientCore in headless Chrome.
      - name: Stats panel browser test
        run: wasm-pack test --headless --chrome ghostframe-web-ui

  web-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}
      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Clippy (wasm32) and no naga in the wasm graph
        run: |
          cargo clippy -p ghostframe-client-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
          out="$(cargo tree -p ghostframe-client-wasm --target wasm32-unknown-unknown -i naga 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -q '^naga v'; then echo "::error::naga is in the wasm32 graph"; exit 1; fi
      - name: Host tests (router, idle skip, frame limits)
        run: cargo test -p ghostframe-client-wasm --lib
      # Every test file of the crate runs (no --test list to forget): the
      # WebRenderer needs a WebGPU adapter, which webdriver.json asks Chrome
      # to provide in software.
      #
      # Skipped here only: the three tests that draw an H.264 VideoFrame. On a
      # runner with no GPU, Chrome's importExternalTexture makes an invalid
      # texture (the first WebGPU error is inside the import), and the page's
      # later readbacks then fail too. They run on every developer machine
      # with a GPU (`just test-web-renderer`), and the H.264 e2e scenes cover
      # the same path in a real browser.
      - name: WebRenderer browser tests
        run: >-
          wasm-pack test --headless --chrome ghostframe-client-wasm --
          --skip tiles_and_pictures_are_ordered_by_frame_seq_and_the_queue
          --skip cdf53_work_under_a_picture_is_cancelled_and_not_left_pending
          --skip a_picture_that_fails_to_import_is_reported_and_cancels_nothing
