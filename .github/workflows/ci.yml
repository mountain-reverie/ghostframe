name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  packaging:
    name: packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Pure bash: it sources packaging/install.sh and exercises its
      # mode-switch cleanup against a throwaway unit dir. No toolchain.
      - name: mode-switch cleanup
        run: |
          GHOSTFRAME_TEST_UNIT_DIR="$(mktemp -d)" \
            bash tests/packaging/mode_switch_test.sh

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/_setup-system-deps
      - uses: ./.github/workflows/_setup-go
      - uses: ./.github/workflows/_build-web-client
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-fast
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `cdf53-diag` is off in every other build, so nothing else compiles
      # its cfg-gated code or tests; it rotted once already.
      - run: cargo clippy -p ghostframe-lib --all-targets --features cdf53-diag -- -D warnings
      # The GLES backend is mutually exclusive with the default `vulkan`
      # feature, so --workspace above never compiles it. No runner has a Mali
      # GPU, so its tests cannot run here -- which is exactly why the compile
      # must be checked: a feature nobody builds is already broken. Hardware
      # verification is `just test-client-gles` on a GLES 3.1 device.
      #
      # `decode-vaapi` is named explicitly, and that is not redundant. The decode
      # backend is a separate feature axis from the GPU backend (see
      # ghostframe-client-gpu's [features]) because cros-codecs' `v4l2` feature
      # does not compile on x86-64 at all -- it gates a NEON path on the feature
      # instead of the architecture. Cargo features are additive, so if `gles`
      # pulled `v4l2` in there would be NO flag combination that checks the GLES
      # code on this runner, and this guard would be dead. It was, briefly.
      - run: cargo clippy -p ghostframe-client-gpu --no-default-features --features gles,decode-vaapi,test-support --all-targets -- -D warnings
      # And the whole chain under `gles`, because cargo unions features across
      # the graph: a crate further up depending on ghostframe-client-h264 with
      # defaults left on re-enables `vaapi`, collides with `v4l2`, and the
      # client-gpu-only check above stays green while the binary cannot link.
      # Measured -- ghostframe-client-native had exactly that dependency.
      - run: cargo check -p ghostframe-cli --no-default-features --features gles,decode-vaapi
      # And the real ARM combination, which is now buildable here too.
      - run: cargo check -p ghostframe-cli --no-default-features --features gles,decode-gstreamer
      # The decode backend for the ARM client, compile-checked for real on this
      # x86 runner. That is new: the previous cros-codecs backend could not be
      # built off aarch64 at all (it gated a NEON path on a feature rather than
      # on the architecture), so this check did not exist and the comment here
      # explained why. GStreamer builds anywhere its headers are present, so the
      # excuse is gone and the guard is back.
      #
      # Still compile-only -- no runner has a stateless V4L2 decoder. The
      # hardware gate is `just test-client-gstreamer` on the RK3399 reference
      # machine, where the 11 oracles compare against a software golden.
      - run: cargo clippy -p ghostframe-client-h264 --no-default-features --features gstreamer-backend --all-targets -- -D warnings
      - run: cargo clippy -p ghostframe-client-h264 --no-default-features --features gstreamer-backend,test-support --all-targets -- -D warnings
      # One script, shared with `just ci-local`, so the local gate and this
      # job cannot drift apart. The rule and its exemptions are documented there.
      - name: crates read env only in config.rs
        run: ci/check-env-reads.sh
      - name: test-only features are named nowhere they could unify into a build
        run: ci/check-test-features.sh
      - name: no home-directory paths in tracked files
        run: ci/check-local-paths.sh
      - name: release daemon has no test-only features
        run: ci/check-release-features.sh

  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/_setup-system-deps
      - uses: ./.github/workflows/_setup-go
      - uses: ./.github/workflows/_build-web-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-fast
      # `dmabuf_real_*` need a real dma-buf (udmabuf or a DRM dumb buffer) AND a
      # real Vulkan GPU. A hosted runner has neither: _setup-system-deps
      # deliberately installs no Vulkan ICD for this job, and nothing grants
      # access to /dev/udmabuf. (Not verified on a runner: that /dev/udmabuf is
      # absent or unreadable there, and that no software ICD is present.) The
      # tests FAIL rather than self-skip when their input cannot be built, so
      # the exemption lives here, by name prefix, and not in the tests: a
      # developer with a GPU must always see them run. Same rule as
      # ci/skip-list.txt, which is the e2e-only counterpart.
      # Note `--lib` never reaches ghostframe-lib/tests/gpu_pipeline.rs (an
      # integration test holding only `dmabuf_real_*` tests): that file runs
      # in no CI job at all and is local-only, because hosted runners have no
      # GPU or udmabuf. Run it by hand with
      # `cargo test -p ghostframe-lib --test gpu_pipeline` on a GPU host.
      # `gpu_pipeline::fallback_tests` drive the CDF 5/3 fallback forward on a
      # real Vulkan device and fail rather than skip without one; exempted
      # here for the same reason as `dmabuf_real_*`; `gpu_backend_pre_encodes_*`
      # does the same through the frame backend.
      # `invalidate_baseline_keeps_the_longer_cushion` needs a real device too.
      - run: "cargo test --workspace --lib -- --skip dmabuf_real_ --skip gpu_pipeline::fallback_tests:: --skip gpu_backend_pre_encodes_ --skip invalidate_baseline_keeps_the_longer_cushion"
      # --lib skips binary crates entirely, so ghostframe-server's tests (the
      # display clamp, the capture resize logic) and codec_report's ran nowhere
      # in CI. No hardware needed.
      #
      # Under xvfb-run because ghostframe-server's xdamage tests need a real
      # X server: they arm and disarm a Damage object and assert that damage
      # actually flows, which is the only way to catch an arm that silently
      # stops reporting. A runtime self-skip was the alternative and is worse
      # -- it would hide the failure from developers too. Xvfb comes from
      # _setup-system-deps. The tests draw only into a scratch pixmap of their
      # own, so they are also safe against a developer's live session.
      #
      # -noreset, because Xvfb otherwise resets itself each time its last
      # client disconnects, and a connection made during the reset is torn
      # down. These tests are short-lived clients running in parallel, so one
      # finishing while another connects fails the second with "Connection
      # reset by peer". Measured with two threads connecting in a loop: 181 to
      # 244 of 3000 connects refused without the flag, none with it.
      # (-s replaces xvfb-run's default server arguments, hence the screen.)
      - run: xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" cargo test --workspace --bins
      # Integration-test targets are not covered by --lib and CI names them
      # explicitly; a new tests/*.rs file runs nowhere until it is listed here.
      - run: cargo test -p ghostframe-lib --test bwe_bench
      # ghostframe-server's command-line contract (exit codes, the state lock).
      - run: cargo test -p ghostframe-server --test commands

  build-release:
    name: build-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/_setup-system-deps
      - uses: ./.github/workflows/_setup-go
      - uses: ./.github/workflows/_build-web-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release
      - run: cargo build --workspace --release --exclude ghostframe-e2e
      # The workspace build unifies ghostframe-e2e's test features (via
      # ghostframe-bench) into the daemon, so rebuild it alone, as
      # `just build-release` does, and check that one. Mirrors `just ci-local`.
      - run: cargo build --release -p ghostframe-server
      - name: release daemon carries no test-only feature
        run: |
          if grep -aq 'software Vulkan permitted (test build)' target/release/ghostframe-server; then echo "::error::release ghostframe-server contains the software-Vulkan test-build literal"; exit 1; fi
          ci/check-release-binary.sh

  web-client:
    name: web-client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}
      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.15.0 --locked
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ghostframe-web-client/package-lock.json
      - name: install + build
        working-directory: ghostframe-web-client
        run: |
          npm ci
          npm run build
          npx tsc --noEmit
      - name: upload dist artifact for e2e.yml
        uses: actions/upload-artifact@v7
        with:
          name: web-client-dist
          path: ghostframe-web-client/dist/
          retention-days: 7
          if-no-files-found: error

  cbindgen-check:
    name: cbindgen-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/_setup-system-deps
      - uses: ./.github/workflows/_setup-go
      - uses: ./.github/workflows/_build-web-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-fast
      - name: regenerate header via build.rs
        run: cargo check -p ghostframe-lib
      - name: verify committed header is up to date
        run: |
          if ! git diff --exit-code ghostframe-lib/include/ghostframe.h; then
            echo "::error::ghostframe-lib/include/ghostframe.h is out of date."
            echo "Run 'cargo check -p ghostframe-lib' locally and commit the regenerated header."
            exit 1
          fi

      # The C client API has its OWN cbindgen header, generated by
      # ghostframe-client-capi/build.rs. It went ungated until M4a added a
      # field to `gf_event` and noticed nothing would have caught a stale
      # copy -- which downstream C consumers compile against.
      - name: regenerate the client C API header via build.rs
        run: cargo check -p ghostframe-client-capi
      - name: verify committed client C API header is up to date
        run: |
          if ! git diff --exit-code ghostframe-client-capi/include/ghostframe_client.h; then
            echo "::error::ghostframe-client-capi/include/ghostframe_client.h is out of date."
            echo "Run 'cargo check -p ghostframe-client-capi' locally and commit the regenerated header."
            exit 1
          fi

  go-vet:
    name: go-vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/_setup-go
      - uses: ./.github/workflows/_build-web-client
      - working-directory: ghostbridge
        run: |
          # Populate ghostbridge/dist/ (//go:embed source). Cargo-driven
          # jobs hit this via build.rs → make archive, but go vet runs
          # directly and would otherwise fail with `pattern all:dist:
          # no matching files found`.
          make sync-dist
          go vet ./...
          go build ./...
          # The native client links a `-tags noweb` archive (no //go:embed;
          # see ghostframe-tsnet's `web-embed` feature). Untagged `go vet`
          # never compiles web_dist_noweb.go, so vet it explicitly -- a
          # break there would otherwise surface as a failed cargo build in
          # whichever client job ran next.
          go vet -tags noweb ./...
          go build -tags noweb ./...
