name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  packaging:
    name: packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pure bash: it sources packaging/install.sh and exercises its
      # mode-switch cleanup against a throwaway unit dir. No toolchain.
      - name: mode-switch cleanup
        run: |
          GHOSTFRAME_TEST_UNIT_DIR="$(mktemp -d)" \
            bash tests/packaging/mode_switch_test.sh

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/_setup-system-deps
      - uses: ./.github/workflows/_setup-go
      - uses: ./.github/workflows/_build-web-client
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-fast
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The GLES backend is mutually exclusive with the default `vulkan`
      # feature, so --workspace above never compiles it. No runner has a Mali
      # GPU, so its tests cannot run here -- which is exactly why the compile
      # must be checked: a feature nobody builds is already broken. Hardware
      # verification is `just test-client-gles` on a GLES 3.1 device.
      #
      # `decode-vaapi` is named explicitly, and that is not redundant. The decode
      # backend is a separate feature axis from the GPU backend (see
      # ghostframe-client-gpu's [features]) because cros-codecs' `v4l2` feature
      # does not compile on x86-64 at all -- it gates a NEON path on the feature
      # instead of the architecture. Cargo features are additive, so if `gles`
      # pulled `v4l2` in there would be NO flag combination that checks the GLES
      # code on this runner, and this guard would be dead. It was, briefly.
      - run: cargo clippy -p ghostframe-client-gpu --no-default-features --features gles,decode-vaapi,test-support --all-targets -- -D warnings
      # And the whole chain under `gles`, because cargo unions features across
      # the graph: a crate further up depending on ghostframe-client-h264 with
      # defaults left on re-enables `vaapi`, collides with `v4l2`, and the
      # client-gpu-only check above stays green while the binary cannot link.
      # Measured -- ghostframe-client-native had exactly that dependency.
      - run: cargo check -p ghostframe-cli --no-default-features --features gles,decode-vaapi
      # There is deliberately NO x86 check of `ghostframe-client-h264`'s `v4l2`
      # backend, and it is not an oversight to fix by adding one: cros-codecs
      # 0.0.6 cannot compile off aarch64 with that feature on
      # (image_processing.rs:15, `#[cfg(feature = "v4l2")] use
      # std::arch::aarch64::*`). The crate carries a `compile_error!` saying so,
      # so the attempt fails with a sentence rather than with
      # `could not find aarch64 in arch` from a dependency.
      #
      # Cross-compiling would check it for real, but v4l2r runs bindgen in its
      # build script and would need a target sysroot and libclang wired up here.
      # Until someone wants that, the V4L2 backend's guard is `just check-v4l2`
      # plus `just test-client-v4l2` on the RK3399 reference machine, where the
      # 12 hardware tests run against a software golden.
      - name: ghostframe-lib reads env only in config.rs
        run: |
          # Comment lines are excluded deliberately: the guard constrains code,
          # not prose. Matching comments would push authors to stop naming
          # `env::var` in documentation, which is the opposite of useful.
          #
          # gpu_pipeline/frame.rs is exempt: its three cdf53-diag reads sit in
          # the Vulkan dispatch path, where threading config through is a much
          # larger change. They are feature-gated and race nothing; tracked as
          # deferred work in docs/superpowers/plans/2026-09-08-lib-config.md.
          if grep -rn 'env::var' ghostframe-lib/src --include='*.rs' \
               | grep -v '^ghostframe-lib/src/config.rs' \
               | grep -v '^ghostframe-lib/src/capture/gpu_pipeline/frame.rs' \
               | grep -vE ':[0-9]+: *(//|///|//!)'; then
            echo "::error::ghostframe-lib must read std::env only in config.rs"
            exit 1
          fi

  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/_setup-system-deps
      - uses: ./.github/workflows/_setup-go
      - uses: ./.github/workflows/_build-web-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-fast
      - run: cargo test --workspace --lib
      # --lib skips binary crates entirely, so ghostframe-xdaemon's tests (the
      # display clamp, the capture resize logic) and codec_report's ran nowhere
      # in CI. No hardware needed.
      #
      # Under xvfb-run because ghostframe-xdaemon's xdamage tests need a real
      # X server: they arm and disarm a Damage object and assert that damage
      # actually flows, which is the only way to catch an arm that silently
      # stops reporting. A runtime self-skip was the alternative and is worse
      # -- it would hide the failure from developers too. Xvfb comes from
      # _setup-system-deps. The tests draw only into a scratch pixmap of their
      # own, so they are also safe against a developer's live session.
      - run: xvfb-run -a cargo test --workspace --bins
      # Integration-test targets are not covered by --lib and CI names them
      # explicitly; a new tests/*.rs file runs nowhere until it is listed here.
      - run: cargo test -p ghostframe-lib --test bwe_bench

  build-release:
    name: build-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/_setup-system-deps
      - uses: ./.github/workflows/_setup-go
      - uses: ./.github/workflows/_build-web-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release
      - run: cargo build --workspace --release --exclude ghostframe-e2e

  web-client:
    name: web-client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.0-${{ runner.os }}
      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.15.0 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ghostframe-web-client/package-lock.json
      - name: install + build
        working-directory: ghostframe-web-client
        run: |
          npm ci
          npm run build
          npx tsc --noEmit
      - name: upload dist artifact for e2e.yml
        uses: actions/upload-artifact@v4
        with:
          name: web-client-dist
          path: ghostframe-web-client/dist/
          retention-days: 7
          if-no-files-found: error

  cbindgen-check:
    name: cbindgen-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/_setup-system-deps
      - uses: ./.github/workflows/_setup-go
      - uses: ./.github/workflows/_build-web-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-fast
      - name: regenerate header via build.rs
        run: cargo check -p ghostframe-lib
      - name: verify committed header is up to date
        run: |
          if ! git diff --exit-code ghostframe-lib/include/ghostframe.h; then
            echo "::error::ghostframe-lib/include/ghostframe.h is out of date."
            echo "Run 'cargo check -p ghostframe-lib' locally and commit the regenerated header."
            exit 1
          fi

      # The C client API has its OWN cbindgen header, generated by
      # ghostframe-client-capi/build.rs. It went ungated until M4a added a
      # field to `gf_event` and noticed nothing would have caught a stale
      # copy -- which downstream C consumers compile against.
      - name: regenerate the client C API header via build.rs
        run: cargo check -p ghostframe-client-capi
      - name: verify committed client C API header is up to date
        run: |
          if ! git diff --exit-code ghostframe-client-capi/include/ghostframe_client.h; then
            echo "::error::ghostframe-client-capi/include/ghostframe_client.h is out of date."
            echo "Run 'cargo check -p ghostframe-client-capi' locally and commit the regenerated header."
            exit 1
          fi

  go-vet:
    name: go-vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/_setup-go
      - uses: ./.github/workflows/_build-web-client
      - working-directory: ghostbridge
        run: |
          # Populate ghostbridge/dist/ (//go:embed source). Cargo-driven
          # jobs hit this via build.rs → make archive, but go vet runs
          # directly and would otherwise fail with `pattern all:dist:
          # no matching files found`.
          make sync-dist
          go vet ./...
          go build ./...
          # The native client links a `-tags noweb` archive (no //go:embed;
          # see ghostframe-tsnet's `web-embed` feature). Untagged `go vet`
          # never compiles web_dist_noweb.go, so vet it explicitly -- a
          # break there would otherwise surface as a failed cargo build in
          # whichever client job ran next.
          go vet -tags noweb ./...
          go build -tags noweb ./...
