name: Setup ghostframe system dependencies
description: >
  Installs the apt packages required to build ghostframe on a runner
  (clang, ffmpeg dev libs, x264, X11/DRM dev headers, xkbcommon for the
  native client's keyboard handling, GStreamer dev libs for the ARM
  client's decode backend, and Xvfb so the X11-dependent ghostframe-server tests
  can run -- see the `unit` job in ci.yml). When the
  `e2e-runtime` input is `true`, also installs the runtime packages
  the e2e harness needs on the host itself (weston compositor,
  XWayland, mesa GL DRI driver for weston's GL renderer, mesa Vulkan
  ICDs for the Chromium SwiftShader fallback). The Vulkan ICDs are
  deliberately NOT installed for non-e2e jobs, because llvmpipe is
  not a faithful substitute for the real GPU in the gpu_pipeline lib
  tests — those tests rely on adapter-construction failure to
  self-skip, and a software ICD silently flips that skip off.

inputs:
  e2e-runtime:
    description: Install the e2e harness runtime packages (weston, mesa, vulkan ICDs).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: apt cache key
      id: key
      shell: bash
      run: |
        # ImageOS/ImageVersion are set by GitHub-hosted runners. The version
        # is part of the key because the cached lists and .debs were resolved
        # against that image's installed packages (the install upgrades
        # systemd, glib, ...). Without it (self-hosted), fall back to a weekly
        # key rather than an unversioned one.
        image="${ImageOS:-unknown}-${ImageVersion:-week$(date -u +%G-%V)}"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "stage=${RUNNER_TEMP}/apt-cache" >> "$GITHUB_OUTPUT"

    # Separate restore/save (rather than one actions/cache step) so the entry
    # is saved right after the install, not in a post step that a cancelled or
    # failed job never reaches. The e2e-runtime input is in the key because it
    # changes the package set. Saving when another job already holds the key
    # logs a warning and does not fail the step.
    - name: restore apt cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.stage }}
        key: apt-v1-e2e${{ inputs.e2e-runtime }}-${{ steps.key.outputs.image }}-${{ hashFiles('.github/workflows/_setup-system-deps/**') }}

    - name: install apt packages
      id: install
      shell: bash
      env:
        E2E_RUNTIME: ${{ inputs.e2e-runtime }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        STAGE: ${{ steps.key.outputs.stage }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"

    - name: save apt cache
      if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.install.outputs.stage-ready == 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.key.outputs.stage }}
        key: apt-v1-e2e${{ inputs.e2e-runtime }}-${{ steps.key.outputs.image }}-${{ hashFiles('.github/workflows/_setup-system-deps/**') }}
