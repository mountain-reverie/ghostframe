name: Setup ghostframe system dependencies
description: >
  Installs the apt packages required to build ghostframe on a runner
  (clang, ffmpeg dev libs, x264, X11/DRM dev headers). When the
  `e2e-runtime` input is `true`, also installs the runtime packages
  the e2e harness needs on the host itself (weston compositor,
  XWayland, mesa GL DRI driver for weston's GL renderer, mesa Vulkan
  ICDs for the Chromium SwiftShader fallback). The Vulkan ICDs are
  deliberately NOT installed for non-e2e jobs, because llvmpipe is
  not a faithful substitute for the real GPU in the gpu_pipeline lib
  tests — those tests rely on adapter-construction failure to
  self-skip, and a software ICD silently flips that skip off.

inputs:
  e2e-runtime:
    description: Install the e2e harness runtime packages (weston, mesa, vulkan ICDs).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: apt-get update
      shell: bash
      run: sudo apt-get update -qq

    - name: install build deps
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          pkg-config \
          clang \
          libclang-dev \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libswscale-dev \
          libavdevice-dev \
          libx264-dev \
          libx11-dev \
          libxext-dev \
          libxdamage-dev \
          libdrm-dev

    - name: install e2e-harness runtime deps
      if: ${{ inputs.e2e-runtime == 'true' }}
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          weston \
          xwayland \
          libgl1-mesa-dri \
          mesa-vulkan-drivers \
          libegl1
