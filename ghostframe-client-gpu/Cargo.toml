[package]
name = "ghostframe-client-gpu"
version = "0.1.0"
edition = "2021"

# GPU decode and dmabuf export for the native client.
#
# Deliberately knows nothing about networking: it takes decoded or
# undecoded tile payloads and produces an exported dmabuf. That boundary is
# what lets the real WGSL run against real pixels in-process.
# `ghostframe-client-core/tests/oracle_gpu_sparse.rs` can only re-implement
# the shader arithmetic in Rust, hand-kept in step with three shader sites,
# so a divergence between that model and the shipped WGSL is invisible to
# it. Closing that gap is this crate's reason to exist.

[dependencies]
ghostframe-protocol = { path = "../ghostframe-protocol" }
ghostframe-client-core = { path = "../ghostframe-client-core" }
# Only for `DmabufPlanes`/`PlaneDesc` (see `src/import.rs`) -- this crate must
# not link ffmpeg, so `test-support` (gradient_clip, vainfo_reports_h264_vld)
# stays out of this dependency and out of the default feature set.
ghostframe-client-h264 = { path = "../ghostframe-client-h264" }
wgpu = { workspace = true }
wgpu-hal = { workspace = true }
ash = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
pollster = { workspace = true }

[dev-dependencies]
proptest = "1"
