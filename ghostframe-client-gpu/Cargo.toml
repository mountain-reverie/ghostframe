[package]
name = "ghostframe-client-gpu"
version = "0.1.0"
edition = "2021"

# GPU decode and dmabuf export for the native client.
#
# Deliberately knows nothing about networking: it takes decoded or
# undecoded tile payloads and produces an exported dmabuf. That boundary is
# what lets the real WGSL run against real pixels in-process.
# `ghostframe-client-core/tests/oracle_gpu_sparse.rs` can only re-implement
# the shader arithmetic in Rust, hand-kept in step with three shader sites,
# so a divergence between that model and the shipped WGSL is invisible to
# it. Closing that gap is this crate's reason to exist.

[dependencies]
ghostframe-protocol = { path = "../ghostframe-protocol" }
ghostframe-client-core = { path = "../ghostframe-client-core" }
# `DmabufPlanes`/`PlaneDesc` are the boundary type (see `src/import.rs`);
# `src/renderer.rs` also drives `H264Decoder`/`HwFrame` directly for the
# H.264 decode/blit path (Task 9). Both routes pull in ffmpeg transitively
# through this dependency -- there is no ffmpeg-free build of this crate any
# more, and there was not one even before Task 9: `ghostframe-client-h264`'s
# `decoder.rs` is unconditional, not behind `test-support`. What
# `test-support` (see `[dev-dependencies]` below) actually keeps out of the
# default feature set is the ADDITIONAL encode-side surface -- `testclip`'s
# libx264 encoder and `vainfo_reports_h264_vld` -- which is test-only and has
# no reason to ship in a release build.
ghostframe-client-h264 = { path = "../ghostframe-client-h264" }
wgpu = { workspace = true }
wgpu-hal = { workspace = true }
ash = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
pollster = { workspace = true }

[dev-dependencies]
# `test-support` enables `gradient_clip` and `vainfo_reports_h264_vld`,
# needed by `tests/gpu_h264_render.rs`. Still feature-gated and off by
# default in `[dependencies]` above -- but see that entry's comment: since
# Task 9, what stays out of a release build is the encode-side test helpers,
# not ffmpeg linkage itself. Those stopped being the same question once
# `renderer.rs` started calling `H264Decoder` unconditionally.
ghostframe-client-h264 = { path = "../ghostframe-client-h264", features = ["test-support"] }
proptest = "1"
# So `tests/gpu_h264_render.rs` can print which import path
# (`blit_h264_frame`'s `tracing::info!`) actually ran -- with no subscriber
# installed those events go nowhere, not even under `--nocapture`.
tracing-subscriber = { workspace = true }
# Parses/validates `shaders/client/*.wgsl` directly (src/shader_validation.rs,
# Task 8 review item (a)) -- no GPU needed, so this runs under CI's `cargo
# test --workspace --lib`. Pinned to the exact version `wgpu` itself resolves
# (`cargo tree -p ghostframe-client-gpu -i naga`), so this test parses with
# the same frontend `create_shader_module` will use, not a drifted one.
# `wgsl-in` is required explicitly: naga's default features are empty.
naga = { version = "=30.0.1", features = ["wgsl-in"] }
# Cross-checks the Tier B oracle's own hand-written round-toward-zero f32->f16
# packer (src/nv12_oracle_tests.rs) against a standard round-to-nearest-even
# f16 implementation in a property test. Test-only: the oracle's actual
# quantiser is not this crate's `half::f16::from_f32`, which rounds the wrong
# way for design doc §9.1's compressed-export model.
half = "2"

# `nv12_reference` (src/nv12_reference.rs) is the CPU oracle Task 8's shader
# test asserts against; it has no reason to exist in a release build. Off by
# default, mirroring `ghostframe-client-h264`'s `test-support` (see that
# crate's Cargo.toml, and 21a0221, which fixed the same defect for that
# crate: a default-on test-support feature ships test-only code into every
# release build that forgets `default-features = false`). This crate's own
# `#[cfg(test)]` builds reach `nv12_reference` without the feature; a
# `tests/*.rs` integration test, a separate crate unit, needs it explicitly.
[features]
default = []
test-support = []
