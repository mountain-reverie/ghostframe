[workspace]
resolver = "2"
members = [
    "ghostframe-protocol",
    "ghostframe-tsnet",
    "ghostframe-client-core",
    "ghostframe-client-net",
    "ghostframe-client-wasm",
    "ghostframe-client-gpu",
    "ghostframe-client-native",
    "ghostframe-client-capi",
    "ghostframe-cli",
    "ghostframe-lib",
    "ghostframe-xdaemon",
    "ghostframe-test-pattern",
    "ghostframe-e2e",
    "ghostframe-bench",
]

[workspace.dependencies]
# quinn-proto 0.11.14 — latest 0.11.x as of 2026-04-15
quinn-proto = { version = "=0.11.14", default-features = false, features = ["rustls"] }

# rustls 0.23.38 — latest stable 0.23.x; requires explicit feature for ring or aws-lc-rs
rustls = { version = "=0.23.38", default-features = false, features = ["ring", "std", "tls12"] }

# rcgen 0.14.7 — latest; NOTE: field renamed key_pair -> signing_key in 0.14.x
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "ring"] }

# web-transport-proto 0.6.0 — latest; provides Settings/ConnectRequest/ConnectResponse
web-transport-proto = { version = "=0.6.0" }

# tokio 1.52.0 — latest stable 1.x as of 2026-04-15
tokio = { version = "=1.52.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }

# bytes 1.11.1 — latest stable 1.x
bytes = { version = "=1.11.1" }

# thiserror 2.0.18 — latest stable 2.x
thiserror = { version = "=2.0.18" }

# tracing 0.1.44 — latest stable 0.1.x
tracing = { version = "=0.1.44" }

# tracing-subscriber 0.3.23 — latest stable 0.3.x
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }

# libc 0.2.185 — latest stable 0.2.x
libc = { version = "=0.2.185" }

# cbindgen 0.29.2 — latest stable 0.x
cbindgen = { version = "=0.29.2" }

# sha2 0.10.9 — pinned to 0.10.x to avoid duplicate-version conflicts with
# other RustCrypto crates in the rustls/quinn tree (0.11.x is a major bump).
sha2 = { version = "=0.10.9" }

# hex 0.4.3 — latest stable 0.4.x
hex = { version = "=0.4.3" }

# time — used by rcgen for cert validity; re-exported to set not_before/not_after
time = { version = "0.3" }

# ash 0.38 — raw Vulkan bindings for DMA-BUF import readback
ash = { version = "0.38", default-features = false, features = ["std", "debug", "loaded"] }

# wgpu 30.0.1 — the current newest release, which builds on the 1.96.1
# toolchain this workspace pins (verified 2026-09-22; there is no 31.x to
# reject). Vulkan-only: the native client's output is a dmabuf, so the other
# backends are dead weight in a library other projects link.
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "wgsl"] }

# wgpu-hal — the escape hatch for the one thing wgpu cannot do. wgpu 30 can
# IMPORT a dmabuf (Features::VULKAN_EXTERNAL_MEMORY_DMA_BUF plus
# texture_from_dmabuf_fd) but has no export counterpart, so the client
# allocates exportable images itself and re-wraps them with
# wgpu_hal::vulkan::Device::texture_from_raw. Must track wgpu's version
# exactly: texture_from_raw's signature has changed across releases.
wgpu-hal = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

# ffmpeg-next 9.0.0 — Rust bindings for FFmpeg (libavcodec, libavutil, libswscale)
ffmpeg-next = { version = "=9.0.0" }

# Tests run the full production data path — QUIC AEAD crypto, the CDF53
# codec, tile reassembly — so an unoptimized build is dominated by it. The
# browserless netsim scenes are the extreme case: 13.9s unoptimized against
# 0.8s optimized for one delayed-link scene, and the e2e sweep runs dozens.
#
# Dependencies go to full `opt-level = 3` (they are built once and cached,
# and nobody steps through ring or quinn-proto); our own crates take
# `opt-level = 1`, which keeps compile times and debuggability close to a
# plain debug build. `debug = true` is inherited from the default `dev`
# profile, so backtraces and breakpoints still work.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `test` inherits from `dev`, but state it explicitly: these two are what
# `cargo test` actually builds, and a future edit to `dev` alone should not
# silently change them.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
