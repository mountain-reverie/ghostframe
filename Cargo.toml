[workspace]
resolver = "2"
members = [
    "ghostframe-protocol",
    "ghostframe-tsnet",
    "ghostframe-client-core",
    "ghostframe-client-net",
    "ghostframe-client-wasm",
    "ghostframe-client-gpu",
    "ghostframe-client-native",
    "ghostframe-client-capi",
    "ghostframe-client-h264",
    "ghostframe-cli",
    "ghostframe-lib",
    "ghostframe-xdaemon",
    "ghostframe-test-pattern",
    "ghostframe-e2e",
    "ghostframe-bench",
]

[workspace.dependencies]
# quinn-proto 0.11.14 — latest 0.11.x as of 2026-04-15
quinn-proto = { version = "=0.11.14", default-features = false, features = ["rustls"] }

# rustls 0.23.38 — latest stable 0.23.x; requires explicit feature for ring or aws-lc-rs
rustls = { version = "=0.23.38", default-features = false, features = ["ring", "std", "tls12"] }

# rcgen 0.14.7 — latest; NOTE: field renamed key_pair -> signing_key in 0.14.x
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "ring"] }

# web-transport-proto 0.6.0 — latest; provides Settings/ConnectRequest/ConnectResponse
web-transport-proto = { version = "=0.6.0" }

# tokio 1.52.0 — latest stable 1.x as of 2026-04-15
tokio = { version = "=1.52.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }

# bytes 1.11.1 — latest stable 1.x
bytes = { version = "=1.11.1" }

# thiserror 2.0.18 — latest stable 2.x
thiserror = { version = "=2.0.18" }

# tracing 0.1.44 — latest stable 0.1.x
tracing = { version = "=0.1.44" }

# tracing-subscriber 0.3.23 — latest stable 0.3.x
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }

# libc 0.2.185 — latest stable 0.2.x
libc = { version = "=0.2.185" }

# cbindgen 0.29.2 — latest stable 0.x
cbindgen = { version = "=0.29.2" }

# sha2 0.10.9 — pinned to 0.10.x to avoid duplicate-version conflicts with
# other RustCrypto crates in the rustls/quinn tree (0.11.x is a major bump).
sha2 = { version = "=0.10.9" }

# hex 0.4.3 — latest stable 0.4.x
hex = { version = "=0.4.3" }

# time — used by rcgen for cert validity; re-exported to set not_before/not_after
time = { version = "0.3" }

# ash 0.38 — raw Vulkan bindings for DMA-BUF import readback
ash = { version = "0.38", default-features = false, features = ["std", "debug", "loaded"] }

# wgpu 30.0.1 — the current newest release, which builds on the 1.96.1
# toolchain this workspace pins (verified 2026-09-22; there is no 31.x to
# reject).
#
# NO backend is selected here. `ghostframe-client-gpu`'s own `vulkan`
# (default) / `gles` features turn exactly one on, because the two need
# different escape hatches and different link-time dependencies -- see that
# crate's `[features]`. Selecting one here would force it on for both. The
# other backends (metal, dx12, webgpu) stay off regardless: the native
# client's output is a dmabuf, so they are dead weight in a library other
# projects link.
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }

# wgpu-hal — the escape hatch for the one thing wgpu cannot do: EXPORT a
# dmabuf. wgpu 30 can import one but has no export counterpart, so the client
# allocates the exportable resource itself and re-wraps it.
#
# Vulkan: allocate an exportable VkImage, re-wrap with
# `wgpu_hal::vulkan::Device::texture_from_raw`.
# GLES: `AdapterContext::egl_instance()` to load `eglExportDMABUFImageMESA`,
# and `wgpu_hal::gles::Device::texture_from_raw` to wrap a GL texture name.
#
# Must track wgpu's version exactly: both `texture_from_raw` signatures have
# changed across releases, and `EglInstance` is a khronos-egl type alias that
# has to match the version wgpu-hal itself resolves (see `khronos-egl` below).
wgpu-hal = { version = "=30.0.1", default-features = false }

# khronos-egl 6 — EGL bindings for the GLES backend's dmabuf export/import.
#
# `wgpu_hal::gles::AdapterContext::egl_instance()` returns
# `&khronos_egl::DynamicInstance<khronos_egl::EGL1_4>`, so this MUST be the
# same version wgpu-hal resolves or the type does not match and the escape
# hatch is unreachable. `dynamic` mirrors the feature wgpu-hal itself asks
# for: it loads libEGL at runtime rather than linking it, which is what lets a
# Vulkan-only build not depend on libEGL at all.
#
# MESA extensions (`eglExportDMABUFImageMESA`) are not wrapped by this crate;
# they are loaded through `get_proc_address` and called as raw function
# pointers. See `export.rs`'s GLES path.
khronos-egl = { version = "=6.0.0", default-features = false, features = ["dynamic"] }

# pollster 1.0.1 — latest stable 1.x. wgpu's request_adapter/request_device
# are async but this crate has no async runtime (and doesn't want tokio
# just to block on two futures at startup); pollster's block_on spins the
# calling thread to completion with zero transitive deps.
pollster = { version = "=1.0.1" }

# ffmpeg-next 9.0.0 — Rust bindings for FFmpeg (libavcodec, libavutil, libswscale)
ffmpeg-next = { version = "=9.0.0" }

# ffmpeg-sys-next 9.0.0 — raw FFmpeg bindings, for the unsafe hwdevice/hwframe
# calls ffmpeg-next doesn't expose (VA-API device/frame context setup). Pinned
# like every other entry in this table; must match ffmpeg-next's version.
ffmpeg-sys-next = { version = "=9.0.0" }

# cros-codecs 0.0.6 — H.264 bitstream parsing plus the V4L2 Request API
# stateless decode backend, for the ARM client where there is no VA-API
# driver at all (see docs/superpowers/specs/2026-09-25-native-client-gles-v4l2-design.md).
# Only reached by `ghostframe-client-h264/v4l2`, which is off by default, so an
# x86 build links none of it.
#
# `default-features = false` because the default pulls the VA-API backend and
# libva with it, which is the exact dependency this backend exists to avoid.
#
# Pinned exactly, like every other entry here, and that matters more than
# usual for a 0.0.x crate whose API churns: 0.0.6 is the version the hardware
# feasibility work measured against, and the two patches we carry
# (tools/hw-probe/v4l2-expbuf-rs/cros-codecs-0.0.6.patch) are written against
# it line by line.
cros-codecs = { version = "=0.0.6", default-features = false, features = ["v4l2"] }

# There is deliberately no `v4l2r` entry here, even though this backend calls
# `VIDIOC_EXPBUF` through it. `cros-codecs` re-exports the exact `v4l2r` it was
# built against (`pub use v4l2r`), and that is the only version safe to use:
# `VideoFrame::process_dqbuf` takes `v4l2r` types by value, so a second copy of
# the crate at a different version meets it as a *different type* and surfaces
# as a bewildering trait-mismatch error rather than a version complaint. Reach
# it as `cros_codecs::v4l2r::…` and the question cannot arise.

# clap 4.6.7 — latest stable 4.x as of 2026-09-22; derive-based CLI parsing
# for ghostframe-cli.
clap = { version = "=4.6.7", features = ["derive"] }

# Tests run the full production data path — QUIC AEAD crypto, the CDF53
# codec, tile reassembly — so an unoptimized build is dominated by it. The
# browserless netsim scenes are the extreme case: 13.9s unoptimized against
# 0.8s optimized for one delayed-link scene, and the e2e sweep runs dozens.
#
# Dependencies go to full `opt-level = 3` (they are built once and cached,
# and nobody steps through ring or quinn-proto); our own crates take
# `opt-level = 1`, which keeps compile times and debuggability close to a
# plain debug build. `debug = true` is inherited from the default `dev`
# profile, so backtraces and breakpoints still work.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `test` inherits from `dev`, but state it explicitly: these two are what
# `cargo test` actually builds, and a future edit to `dev` alone should not
# silently change them.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
