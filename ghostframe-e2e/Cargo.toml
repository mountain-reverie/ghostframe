[package]
name = "ghostframe-e2e"
version = "0.1.0"
edition = "2021"

# Empty library — this crate exists to host integration tests in `tests/`.
# Heavy e2e dependencies (chromiumoxide, testcontainers, axum, tower-http,
# image, image-compare) live here instead of in ghostframe-lib so that
# `cargo test --lib --package ghostframe-lib` doesn't have to compile them.

[lib]
path = "src/lib.rs"

[dependencies]
# Use ghostframe-lib with `test-loss-injection` enabled so the harness's
# GHOSTFRAME_OUTBOUND_LOSS_* / GHOSTFRAME_INBOUND_LOSS_* env vars take effect.
ghostframe-lib = { path = "../ghostframe-lib", features = ["test-loss-injection"] }
# Harness library needs these at lib-build time (was dev-deps).
testcontainers = "0.27"
chromiumoxide = "0.9"
serde = "1"
serde_json = "1"
anyhow = "1"
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
image-compare = "0.4"
image = { version = "0.25", features = ["png"] }
rcgen = "0.14"
sha2 = "0.10"
base64 = "0.22"
async-trait = "0.1"
fantoccini = "0.21"
tempfile = "3"
which = "6"
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# Used by tests/e2e.rs test code only (not by the harness library).
ghostframe-test-pattern = { path = "../ghostframe-test-pattern" }
# Only used by tests/loopback_h3.rs (sans-IO QUIC/H3 test).
quinn-proto = { workspace = true }
rustls = { workspace = true }
url = "2"
web-transport-proto = { workspace = true }
