[package]
name = "ghostframe-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
ghostframe-lib = { path = "../ghostframe-lib" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
x11rb = { version = "0.13", features = ["damage", "xtest", "xfixes", "randr", "shm"] }
# Optional capture-dump diagnostic: write each captured frame to a PNG on
# disk when GHOSTFRAME_CAPTURE_DUMP_DIR is set. Default-features off keeps
# the dependency tree small (PNG encoder only).
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
