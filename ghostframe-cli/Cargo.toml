[package]
name = "ghostframe-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "ghostframe_cli"
path = "src/lib.rs"

[[bin]]
name = "ghostframe"
path = "src/main.rs"

[dependencies]
ghostframe-client-native = { path = "../ghostframe-client-native" }
ghostframe-tsnet = { path = "../ghostframe-tsnet" }
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
